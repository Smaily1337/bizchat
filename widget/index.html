<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BizChat Widget Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #1a1d22, #0e1012);
      color: #fff;
      padding: 2rem;
    }
    .demo {
      max-width: 32rem;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.6); line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-size: 0.85rem; color: rgba(255,255,255,0.55); }
    input {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.65rem 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #fff;
      box-sizing: border-box;
    }
    button {
      margin-top: 1rem;
      padding: 0.7rem 1.1rem;
      border: 0;
      border-radius: 0.75rem;
      background: #F4E04D;
      color: #121417;
      font-weight: 700;
      cursor: pointer;
    }
    code { background: rgba(255,255,255,0.08); padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="demo">
    <h1>BizChat Widget</h1>
    <p>
      Wklej <code>business_id</code> z seeda / panelu (Kanały), potem uruchom chat.
      API domyślnie: <code>http://localhost:8000</code>.
    </p>
    <label>
      API URL
      <input id="api" value="http://localhost:8000" />
    </label>
    <label>
      Business ID
      <input id="business" placeholder="uuid z seed / panelu" />
    </label>
    <label>
      Imię (opcjonalnie)
      <input id="name" placeholder="Gość" />
    </label>
    <button id="start" type="button">Uruchom widget</button>
    <p style="margin-top:1.5rem;font-size:0.85rem">
      Embed produkcyjny:
    </p>
    <pre style="overflow:auto;background:rgba(0,0,0,0.35);padding:1rem;border-radius:0.75rem;font-size:0.75rem;color:rgba(255,255,255,0.7)">&lt;script src="/widget/bizchat-widget.js"
  data-api="https://api.example.com"
  data-business-id="YOUR_BUSINESS_UUID"&gt;&lt;/script&gt;</pre>
  </div>
  <script src="./bizchat-widget.js"></script>
  <script>
    document.getElementById("start").onclick = function () {
      var api = document.getElementById("api").value.trim();
      var businessId = document.getElementById("business").value.trim();
      var name = document.getElementById("name").value.trim();
      if (!businessId) {
        alert("Podaj business_id");
        return;
      }
      window.BizChatWidget.mount({
        apiBase: api,
        businessId: businessId,
        name: name || undefined,
      });
    };
  </script>
</body>
</html>
