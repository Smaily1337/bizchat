services:
  postgres:
    image: postgres:16-alpine
    container_name: bizchat-postgres
    environment:
      POSTGRES_DB: bizchat
      POSTGRES_USER: bizchat
      POSTGRES_PASSWORD: bizchat
    ports:
      - "5432:5432"
    volumes:
      - bizchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizchat -d bizchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizchat-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bizchat:bizchat@postgres:5432/bizchat
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost,http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./widget:/app/widget:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: bizchat-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  bizchat_pgdata:
